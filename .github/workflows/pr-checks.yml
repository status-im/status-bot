name: PR Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint & format
    runs-on: ['self-hosted','ubuntu-22.04']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Runing unit test
    runs-on: ['self-hosted','ubuntu-22.04']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest tests/ -v

  security:
    name: Dependency audit
    runs-on: ['self-hosted','ubuntu-22.04']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + pip-audit
        run: pip install -e . pip-audit

      - name: Run pip-audit
        run: pip-audit

  misc:
    name: YAML validation
    runs-on: ['self-hosted','ubuntu-22.04']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate YAML files
        run: |
          pip install pyyaml
          python -c "import yaml; [yaml.safe_load(open(f)) for f in ['config.yaml', 'docker-compose.yaml']]; print('YAML OK')"
