database:
    type: postgres
    host: "localhost"
    port: 5432
    name: "status-bot"

logging:
    format: human
    level: info
    uvicorn_access: false

bot:
    name: 'status-bot'
    chat_key: "zQ3..Example"
    bot_hash_pepper: '' # Use a large random value

backend:
    domain: "localhost"
    backend_port: 8080
    is_secure: false

api:
    enable: true
    host: "0.0.0.0"
    port: 8081
    # api_key: "your-secret-key"

modules:
    directories: []
    enabled: ["messaging", "receiver", "community_monitoring", "discourse_bridge"]
    settings:
        receiver:
            messages_table: "received_messages"
            chats_table: "received_chats"
        community_monitoring:
            interval: 900
            schema: "status_app_monitoring"
            detoxify: true
            communities:
                - Status
                - Logos
        discourse_bridge:
            category_name: "discuss.status.app"
            delay: 5 # Seconds to wait between every sent Discourse message
            emoji_shortname: ":white_check_mark:"
            api:
                key: ""
                username: ""
            content_type:
                - 1 # Text
            url:
                discourse: "https://discuss.status.app"
                community: "https://status.app/c/G3QAAMQn9ueHRsR3W5Ouuy25fkA9zyknAIEkCbYAoC04HjyGeQ6X8k45q3GVeyZiksbd38tQ4S_EfhrJKhRV3sDvjhmrCuSoDBIf2QJiEKwAOZipxis8ntNRVyPhC5IoWaEsj9X4P5zw093pcLofZzTV2gM=#zQ3shZeEJqTC1xhGUjxuS4rtHSrhJ8vUYp64v6qWkLpvdy9L9"

metrics:
    enabled: true
    host: "0.0.0.0"
    port: 8000
