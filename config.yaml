postgres:
  host: "database"
  port: 5432
  schema: "status_app_monitoring"
  name: "status-bot"
  tables:
    messages: "raw_messages"
    community: "raw_community_info"
# Value must be in MINUTES
sleep: 10
files:
  # Get the latest community chat dates for next run
  current_state: "dates.pkl"

bot:
  display_name: 'e-raccoon'
  public_key: "0xExample"
  compressed_key: "example-compressed-key"
  password: 'ChangeMe'
  mnemonic_phrase: 'some random word ...'
  init_account: true
  infura_token: ""
  coingecko_api_key: ""
  # Parameters based on Account class
  params:
    domain: "status-backend"
    port: 8080
    is_secure: false

modules:
  directories:
    - ./modules
  enabled: []
  settings: {}

prometheus:
  enabled: true
  host: "0.0.0.0"
  port: 8000
