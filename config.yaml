database:
    type: postgres
    host: "localhost"
    port: 5432
    name: "status-bot"

logging:
    format: human
    level: info
    uvicorn_access: false

bot:
    name: 'status-bot'
    chat_key: "zQ3..Example"
    bot_hash_pepper: '' # Use a large random value

backend:
    domain: "localhost"
    backend_port: 8080
    is_secure: false

api:
    enable: true
    host: "0.0.0.0"
    port: 8081
    # api_key: "your-secret-key"

modules:
    directories: []
    enabled: ["messaging", "receiver", "community_monitoring"]
    settings:
        receiver:
            messages_table: "received_messages"
            chats_table: "received_chats"
        community_monitoring:
            interval: 900
            schema: "status_app_monitoring"
            detoxify: true
            communities:
                - Status
                - Logos
metrics:
    enabled: true
    host: "0.0.0.0"
    port: 8000
