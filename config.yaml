database:
  type: postgres
  host: "database"
  port: 5432
  schema: "status_app_monitoring"
  name: "status-bot"
  tables:
    messages: "raw_messages"
    community: "raw_community_info"
# Value must be in MINUTES
sleep: 10

# logging:
#   format: human   # human | json
#   level: info     # debug | info | warning | error
#   uvicorn_access: false   # true to enable FastAPI per-request access logs

files:
  # Get the latest community chat dates for next run
  current_state: "dates.pkl"

bot:
  init_account: true
  display_name: 'e-raccoon'
  public_key: "0xExample"
  #compressed_key: "example-compressed-key"
  bot_hash_pepper: '' #Use a large random value

backend:
  domain: "status-backend"
  backend_port: 8080
  is_secure: false

api:
  enable: true
  host: "0.0.0.0"
  port: 8081
  # api_key: "your-secret-key"

modules:
  directories: []
  enabled: ["messaging", "receiver"]
  settings:
    receiver:
      messages_table: "received_messages"
      chats_table: "received_chats"

prometheus:
  enabled: true
  host: "0.0.0.0"
  port: 8000
