---
services:
    backend:
        container_name: status-backend
        image: harbor.status.im/status-im/status-go:status-bot-1.0.0-rc3
        ports:
            - 8080:8080
            - 9002:9000
            - 8545:8545
            - 30303:30303
            - 9001:9001
        entrypoint: 'status-backend'
        command: '-address 0.0.0.0:8080'
        environment:
            STATUS_GO_MEDIA_SERVER_PORT: "9001"
            STATUS_GO_MEDIA_SERVER_HOST: "0.0.0.0"
        volumes:
            - ./backups:/root/.config/Status/backups
            - ./assets:/assets
            - ./backend-data:/data
        networks:
            - status-bridge
        healthcheck:
            test: ["CMD", "curl http://0.0.0.0:8080/health"]

    bot:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: status-bot
        depends_on:
            - backend
            - database
        volumes:
            - ./backups:/backups
            - ./config.yaml:/app/config.yaml
            - ./assets:/app/assets
        env_file:
            - .env
        ports:
            - 8081:8081
            - 8000:8000
        networks:
            - status-bridge

    database:
        image: postgres:15
        container_name: database
        environment:
            POSTGRES_DB: 'status-bot'
            POSTGRES_USER: 'status'
            POSTGRES_PASSWORD: 'ChangeMeIfYouCare'
        ports:
            - 5432:5432
        volumes:
            - postgres-data:/var/lib/postgresql
        networks:
            - status-bridge
        healthcheck:
            test: ["CMD-SHELL", "pg_isready POSTGRES_USERNAME --dbname POSTGRES_DATABASE"]

networks:
    status-bridge:
        name: status-bridge
        driver: bridge

volumes:
    postgres-data:
